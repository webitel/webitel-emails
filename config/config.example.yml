# webitel-emails local configuration example.

service:
  addr: "127.0.0.1:8080"
  conn:
    # Certificate verification is enabled by default. Disable it only for local development.
    verify_certs: false

oauth:
  # Public callback registered in the Google or Microsoft OAuth application.
  redirect_url: "https://example.webitel.com/oauth/email/callback"

log:
  level: "info"
  json: false
  otel: false
  file: ""
  console: true

postgres:
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/webitel?application_name=email-service&sslmode=disable&connect_timeout=10"

consul:
  addr: "127.0.0.1:8500"

pubsub:
  url: "amqp://webitel:webitel@127.0.0.1:5672/"
  driver: "rabbitmq"
